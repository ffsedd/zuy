[project]
name = "zuy"
version = "0.1.1"
description = "Process and export SEM-EDS data."
readme = "README.md"
authors = [
    { name = "ffsedd", email = "ffsedd@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cycler>=0.12.1",
    "matplotlib>=3.10.3",
    "natsort>=8.4.0",
    "numpy>=2.3.1",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pillow>=10.0.0",
    "pybaselines>=1.2.1",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "xlsxwriter>=3.2.5",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.17.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.3",
    "pandas-stubs>=2.3.2.250926",
    "deptry>=0.25.1",
    "scipy-stubs>=1.15.3,<1.16",
    "types-pyyaml>=6.0.12.20260906",
]
[tool.ruff]
line-length = 99
# select = ["I"]  # Only import-related rules if you want
fix = true      # Enable auto-fixing



[project.scripts]
spectrum = "zuy.cli.spectrum_cli:main"
semeds = "zuy.semeds.main:main"
semangui = "zuy.imannotator.gui:main"
semandraw = "zuy.imannotator.draw:main"
semvis = "zuy.imoverlay.semvis:main"

[tool.deptry]
# The package lives under src/ rather than directly at the project root.
known_first_party = ["zuy"]

[[tool.mypy.overrides]]
# Analyze source annotations in dependencies without a py.typed marker.
# This checks their interfaces rather than ignoring untyped imports.
module = ["xlsxwriter.*", "pybaselines.*"]
follow_untyped_imports = true
